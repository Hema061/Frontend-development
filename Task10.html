<!DOCTYPE html>
<html>
<head>
<title>AI Learning Course</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
padding:0;
text-align:center;
background:#f4f4f4;
}


h1{
font-size:6vw;
color:#2c3e50;
margin-top:20px;
}

.course-box{
width:80%;
max-width:600px;
margin:40px auto;
padding:20px;
border:2px solid #333;
background:white;
border-radius:10px;
transition:transform 0.3s;
}


.course-box:hover{
transform:scale(1.05);
}


p{
font-size:1.5rem;
line-height:1.6;
color:#555;
}


button{
padding:10px 20px;
font-size:1rem;
background:#3498db;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
transition:all 0.3s;
}


button:hover{
background:#1abc9c;
transform:scale(1.1);
box-shadow:0px 5px 15px rgba(0,0,0,0.3);
}


.more-info{
opacity:0;
transition:opacity 0.5s;
margin-top:15px;
}


.course-box:hover .more-info{
opacity:1;
}


@media (max-width:768px){
body{
background:lightyellow;
}
}

</style>
</head>

<body>

<h1>AI Learning Course</h1>

<div class="course-box">

<h2>Start Your AI Journey</h2>

<p>
Join our Artificial Intelligence course and learn machine learning,
data analysis and real-world AI applications.
</p>

<button>Enroll Now</button>

<div class="more-info">
<p>Course Duration: 3 Months | Mode: Online | Certificate Available</p>
</div>

</div>

</body>
</html>
